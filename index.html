<style>

<script>
/* ============================================================
   世界的下落 · WHEREABOUTS（Babylon.js 場景版）
   流程：序言 → 走入房間 → 地上卷宗（便條紙寫擱置天數）
        → 點選 → 撿起 → 撕便條 → 自動翻開封面 → 自由翻閱
   內容：全部來自 events.yaml（繁中 / 英文雙語）
   ============================================================ */
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const FINE = matchMedia('(pointer: fine)').matches;
const PI = Math.PI;
const DAY = 86400000;
const TODAY = new Date();

/* ---------------- 語系 ---------------- */
let LANG = localStorage.getItem('wb-lang') ||
           ((navigator.language||'en').toLowerCase().startsWith('zh') ? 'zh' : 'en');
let pendingLang = null;
const STRINGS = {
  introTitle:   {zh:'世界的下落', en:'WHEREABOUTS'},
  introLine:    {zh:'有些事沒有結局，<br>只是沒有人再問起。',
                 en:'Some things never got an ending —<br>people just stopped asking.'},
  introGo:      {zh:'敲 一 下 ， 推 門 進 去', en:'Knock, and step inside'},
  hintChoose:   {zh:n=>`地上散著 ${n} 份卷宗 · 撿起一份`, en:n=>`${n} case files lie on the floor · pick one up`},
  hintRead:     {zh:'點擊右側翻頁 · 左側回翻', en:'Tap right to turn the page · left to go back'},
  hintReadPort: {zh:'點右側往下讀 · 左側回看', en:'Tap right to read on · left to look back'},
  loading:      {zh:'卷宗整理中…', en:'Preparing the files…'},
  loadFail:     {zh:e=>`讀取卷宗失敗（${e}）— 原始資料：events.yaml`, en:e=>`Failed to load the files (${e}) — raw data: events.yaml`},
  folioCover:   {zh:'— 封面 —', en:'— Cover —'},
  folioEnd:     {zh:'— 卷宗末頁 —', en:'— Last page —'},
  putBack:      {zh:'放 回 地 上', en:'Put it back'},
  chipSrc:      {zh:n=>`附件 · ${n} ↗`, en:n=>`Source · ${n} ↗`},
  chipVideo:    {zh:'▶ 影像附件', en:'▶ Video'},
  vOpen:        {zh:'在 YouTube 開啟 ↗', en:'Open on YouTube ↗'},
  vClose:       {zh:'收 起 附 件', en:'Close'},
  noteOpen:     {zh:'天，沒有下落', en:'days, no ending'},
  noteClosed:   {zh:'天 · 已結案', en:'days · closed'},
  shelvedLabel: {zh:'這件事已被擱置', en:'This has been left for'},
  resolvedLabel:{zh:'從立案到有下落', en:'From opening to resolution'},
  dayUnit:      {zh:' 天', en:' days'},
  filed:        {zh:d=>`立案 ${d}`, en:d=>`Opened ${d}`},
  filedResolved:{zh:d=>`立案 ${d} · 已有下落`, en:d=>`Opened ${d} · resolved`},
  catClosed:    {zh:'已結案', en:'closed'},
  srcLabel:     {zh:n=>`附件 · 資料來源：${n}`, en:n=>`Source · ${n}`},
  videoNote:    {zh:'▶ 本頁有影像附件（畫面下方可播放）', en:'▶ Video attachment — playable below'},
  stuckLabel:   {zh:'目前卡在', en:'Stuck on'},
  closedStamp:  {zh:'結案 · CLOSED', en:'CLOSED'},
  endTitle:     {zh:'這份卷宗先到這裡。', en:'This file ends here, for now.'},
  endOpen:      {zh:'放回地上，或撿起下一份。', en:'Put it back, or pick up another.'},
  endClosed:    {zh:'它已經有了下落。', en:'It has found its ending.'},
  pendingTitle: {zh:'這份卷宗還在整理中。', en:'This file is still being prepared.'},
  pendingSub:   {zh:'改天再來看看它的下落。', en:'Come back another day to see.'},
};
function S(k,...a){const v=STRINGS[k][LANG];return typeof v==='function'?v(...a):v;}
function T(v){return v==null?'':(typeof v==='object'&&('zh' in v||'en' in v)?(v[LANG]??v.zh??v.en):v);}

/* ---------------- 分類 ---------------- */
const CATS = {
  war:     {label:{zh:'戰爭',     en:'War'},      accent:'#9C3B2E', leather:['#33201a','#1d100c']},
  protest: {label:{zh:'示威',     en:'Protest'},  accent:'#B07A2A', leather:['#33270f','#1f160a']},
  disaster:{label:{zh:'災難調查', en:'Disaster'}, accent:'#5C6B66', leather:['#232b28','#141a18']},
  justice: {label:{zh:'司法',     en:'Justice'},  accent:'#3E5C3A', leather:['#1f2a1c','#121a11']},
  disease: {label:{zh:'疾病',     en:'Disease'},  accent:'#7A5BA0', leather:['#28203a','#171225']},
  missing: {label:{zh:'失蹤',     en:'Missing'},  accent:'#3E6E8C', leather:['#1b2a36','#101a23']},
  other:   {label:{zh:'進行中',   en:'Ongoing'},  accent:'#566A64', leather:['#1f2725','#121817']},
};

/* ---------------- 事件資料（events.yaml） ---------------- */
let EVENTS = [];
let DATA_ERR = null;
const days=(a,b)=>Math.max(0,Math.floor((b-new Date(a))/DAY));
async function loadData(){
  try{
    const res=await fetch('events.yaml',{cache:'no-cache'});
    if(!res.ok)throw new Error('events.yaml '+res.status);
    const y=jsyaml.load(await res.text(),{schema:jsyaml.CORE_SCHEMA});
    EVENTS=(y.events||[]).map(e=>({
      id:e.id, cat:CATS[e.category]?e.category:'other', art:e.art||'document',
      status:e.status==='closed'?'closed':'open',
      start:String(e.opened), last:String(e.last_progress||e.opened),
      title:e.title, current:e.summary,
      timeline:Array.isArray(e.timeline)&&e.timeline.length?e.timeline:null,
      stuck:e.stuck||null,
      outcome:e.outcome||null,
    }));
    EVENTS.forEach(e=>{
      e.noteDays = days(e.start, e.status==='closed'&&e.outcome?new Date(e.outcome.date):TODAY);
      e.staleDays = days(e.last, TODAY);
      e.dust = e.staleDays>=365?4:e.staleDays>=180?3:e.staleDays>=90?2:e.staleDays>=30?1:0;
    });
    buildFloor();
    if(state==='WAITDATA'){state='CHOOSE';setHint(S('hintChoose',EVENTS.length));}
  }catch(err){
    DATA_ERR=err.message;
    if(state==='WAITDATA')setHint(S('loadFail',DATA_ERR));
    console.error(err);
  }
}

/* ---------------- 常數 / 引擎 ---------------- */
const PW=3.0, PH=4.05, THICK=0.26, TH2=THICK+0.1;
const PXW=880, PXH=1180;
const FONT=`"Noto Serif TC","Songti TC","PMingLiU",Georgia,serif`;

const stage=document.getElementById('stage');
const canvas=document.createElement('canvas');
stage.appendChild(canvas);
let engine;
try{
  engine=new BABYLON.Engine(canvas,true,{stencil:false});
}catch(err){
  document.getElementById('intro-line').innerHTML=
    '這個頁面需要 WebGL。<br>This page needs WebGL. — <a href="events.yaml" style="color:#cdbd99">events.yaml</a>';
  document.getElementById('intro-go').textContent='';
  throw err;
}
engine.setHardwareScalingLevel(1/Math.min(devicePixelRatio,2));
const scene=new BABYLON.Scene(engine);
scene.useRightHandedSystem=true;
scene.clearColor=BABYLON.Color4.FromHexString('#0b0805FF');
scene.fogMode=BABYLON.Scene.FOGMODE_LINEAR;
scene.fogColor=BABYLON.Color3.FromHexString('#0b0805');
scene.fogStart=12; scene.fogEnd=36;

const camera=new BABYLON.UniversalCamera('cam',new BABYLON.Vector3(0,7.6,18),scene);
camera.fov=46*PI/180; camera.minZ=.1; camera.maxZ=90;

const candle=new BABYLON.PointLight('candle',new BABYLON.Vector3(3.4,7.5,4.2),scene);
candle.diffuse=BABYLON.Color3.FromHexString('#ffb45e');
candle.specular=BABYLON.Color3.FromHexString('#ffd9a0').scale(.3);
candle.range=26; candle.intensity=.75;
const moon=new BABYLON.PointLight('moon',new BABYLON.Vector3(-7,9,-10),scene);
moon.diffuse=BABYLON.Color3.FromHexString('#6a7fa8');
moon.specular=BABYLON.Color3.Black();
moon.range=44; moon.intensity=.28;
const hemi=new BABYLON.HemisphericLight('amb',new BABYLON.Vector3(0,1,0),scene);
hemi.diffuse=BABYLON.Color3.FromHexString('#574736');
hemi.groundColor=BABYLON.Color3.FromHexString('#241a10');
hemi.intensity=.4;

/* ---------------- 共用：DynamicTexture / 紙張 / 斷行 ---------------- */
function newTex(w=PXW,h=PXH){
  const t=new BABYLON.DynamicTexture('t'+Math.random(),{width:w,height:h},scene,true);
  t.anisotropicFilteringLevel=8;
  return t;
}
function parchment(ctx,w=PXW,h=PXH){
  const g=ctx.createLinearGradient(0,0,w,h);
  g.addColorStop(0,'#efe5cd');g.addColorStop(.5,'#e9ddc2');g.addColorStop(1,'#e2d3b4');
  ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
  for(let i=0;i<w;i++){
    ctx.fillStyle=Math.random()<.5?'rgba(120,95,60,.05)':'rgba(255,250,235,.06)';
    ctx.fillRect(Math.random()*w,Math.random()*h,1.4,1.4);
  }
  const e=ctx.createRadialGradient(w/2,h/2,h*.35,w/2,h/2,h*.78);
  e.addColorStop(0,'rgba(0,0,0,0)');e.addColorStop(1,'rgba(92,66,34,.22)');
  ctx.fillStyle=e;ctx.fillRect(0,0,w,h);
}
/* token：單一 CJK 字元｜連續拉丁字（英文單字不拆）｜空白 */
const TOKEN_RE=/[　-鿿豈-﫿＀-￯]|[^\s　-鿿豈-﫿＀-￯]+|\s+/g;
function wrap(ctx,text,maxW){
  const out=[];
  for(const para of String(text).split('\n')){
    if(para.trim()===''){out.push('');continue;}
    let line='';
    for(const tok of para.match(TOKEN_RE)||[]){
      if(line&&ctx.measureText(line+tok).width>maxW){
        out.push(line.trimEnd());
        line=tok.trimStart();
        while(ctx.measureText(line).width>maxW&&line.length>1){   // 超長單字硬切
          let cut=line.length-1;
          while(cut>1&&ctx.measureText(line.slice(0,cut)).width>maxW)cut--;
          out.push(line.slice(0,cut));line=line.slice(cut);
        }
      }else line+=tok;
    }
    out.push(line.trimEnd());
  }
  return out;
}

/* ---------------- 插圖庫（墨線風格） ---------------- */
function drawArt(ctx,name,cx,cy,s,color){
  ctx.save();
  ctx.translate(cx,cy);
  ctx.strokeStyle=color;ctx.fillStyle=color;
  ctx.lineWidth=Math.max(2,s*.035);ctx.lineCap='round';ctx.lineJoin='round';
  const u=s/2, P=p=>p*u;
  const L=(a,b,c,d)=>{ctx.beginPath();ctx.moveTo(P(a),P(b));ctx.lineTo(P(c),P(d));ctx.stroke();};
  const C=(x,y,r,f)=>{ctx.beginPath();ctx.arc(P(x),P(y),P(r),0,PI*2);f?ctx.fill():ctx.stroke();};
  switch(name){
    case 'plane':
      ctx.rotate(.28);
      ctx.beginPath();ctx.ellipse(0,0,P(.8),P(.16),0,0,PI*2);ctx.stroke();
      L(-.05,-.1,-.55,-.62);L(.18,-.1,-.2,-.62);
      L(-.68,-.05,-.95,-.32);
      L(.95,.55,.55,.55);L(1.05,.75,.45,.75);
      break;
    case 'blackbox':
      ctx.strokeRect(P(-.85),P(-.45),P(1.7),P(.9));
      ctx.beginPath();ctx.moveTo(P(-.7),0);
      for(let i=0;i<14;i++){const x=-.7+i*.07;ctx.lineTo(P(x),P((i%2?-.22:.22)*(1-i/16)));}
      ctx.lineTo(P(.45),0);ctx.lineTo(P(.72),0);ctx.stroke();
      C(.72,0,.05,true);
      break;
    case 'report':
      ctx.strokeRect(P(-.55),P(-.8),P(1.1),P(1.6));
      L(-.38,-.55,.38,-.55);L(-.38,-.3,.38,-.3);
      ctx.fillRect(P(-.38),P(-.1),P(.76),P(.12));
      ctx.fillRect(P(-.38),P(.18),P(.5),P(.12));
      L(-.38,.55,.2,.55);
      break;
    case 'search':
      C(-.15,-.15,.5,false);
      L(.22,.22,.75,.75);
      ctx.setLineDash([P(.1),P(.1)]);
      ctx.strokeRect(P(-.85),P(-.85),P(1.7),P(1.7));
      ctx.setLineDash([]);
      break;
    case 'ship':
      ctx.beginPath();ctx.moveTo(P(-.8),P(-.1));ctx.lineTo(P(.8),P(-.1));
      ctx.lineTo(P(.55),P(.25));ctx.lineTo(P(-.55),P(.25));ctx.closePath();ctx.stroke();
      L(0,-.1,0,-.6);L(0,-.6,.35,-.45);
      for(const r of[.35,.55,.75]){ctx.beginPath();ctx.arc(0,P(.45),P(r),.25*PI,.75*PI);ctx.stroke();}
      break;
    case 'ocean':
      for(const dy of[-.4,-.12]){
        ctx.beginPath();
        for(let i=0;i<=20;i++){const x=-.85+i*.085;ctx[i?'lineTo':'moveTo'](P(x),P(dy+Math.sin(i*1.15)*.06));}
        ctx.stroke();
      }
      L(0,.12,0,.62);L(-.13,.46,0,.62);L(.13,.46,0,.62);
      ctx.font=`600 ${P(.5)}px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText('?',P(.5),P(.45));
      break;
    case 'tank':
      ctx.strokeRect(P(-.75),P(.05),P(1.5),P(.4));
      ctx.strokeRect(P(-.3),P(-.3),P(.6),P(.35));
      L(.3,-.15,.95,-.25);
      C(-.5,.45,.12);C(-.15,.45,.12);C(.2,.45,.12);C(.55,.45,.12);
      break;
    case 'ruins':
      L(-.85,.7,.85,.7);
      ctx.strokeRect(P(-.7),P(-.1),P(.35),P(.8));
      ctx.strokeRect(P(-.7),P(-.55),P(.35),P(.3));
      L(-.2,.7,-.2,-.3);L(-.2,-.3,.15,-.05);L(.15,-.05,.15,.7);
      L(.4,.5,.6,.35);L(.5,.62,.72,.5);
      break;
    case 'fire':
      ctx.beginPath();
      ctx.moveTo(0,P(.7));
      ctx.bezierCurveTo(P(-.7),P(.3),P(-.25),P(-.2),0,P(-.75));

/* 卷宗 → faces（每張紙正反兩面，含每面 meta：來源 / 影像） */
const faceCache={};
function getFaces(ev){
  if(faceCache[ev.id])return faceCache[ev.id];
  const flow=[];
  if(ev.timeline){
    ev.timeline.forEach((n,i)=>flow.push({tex:nodeFace(n,i+1,ev.timeline.length),
      meta:{src:n.source||null,video:n.video||null}}));
    if(ev.status!=='closed'&&ev.stuck)flow.push({tex:stuckFace(ev.stuck),meta:{}});
    if(ev.status==='closed'&&ev.outcome)flow.push({tex:outcomeFace(ev),meta:{}});
  }else{
    flow.push({tex:pendingFace(),meta:{}});
  }
  flow.push({tex:endFace(ev.status==='closed'),meta:{}});
  if(flow.length%2)flow.push({tex:blankFaceTex(),meta:{}});
  const faces=[{front:coverFace(ev),back:insideFace(),frontMeta:{},backMeta:{}}];
  for(let i=0;i<flow.length;i+=2){
    faces.push({front:flow[i].tex,back:flow[i+1].tex,
      frontMeta:flow[i].meta,backMeta:flow[i+1].meta});
  }
  faceCache[ev.id]=faces;
  return faces;
}

/* ---------------- 自訂頁面 mesh ---------------- */
function buildPage(name,x0,x1,H,segX,segZ){
  const pos=[],nor=[],uvs=[],idx=[];
  for(let j=0;j<=segZ;j++){
    const z=-H/2+H*j/segZ;
    for(let i=0;i<=segX;i++){
      const x=x0+(x1-x0)*i/segX;
      pos.push(x,0,z);
      nor.push(0,1,0);
      uvs.push(i/segX, 0.5 - z/H);
    }
  }
  const n=(i,j)=>j*(segX+1)+i;
  for(let j=0;j<segZ;j++)for(let i=0;i<segX;i++){
    const A=n(i,j),B=n(i+1,j),C=n(i,j+1),D=n(i+1,j+1);
    idx.push(A,B,C, B,D,C);          // Babylon RH 模式的正面 winding
  }
  const mesh=new BABYLON.Mesh(name,scene);
  const vd=new BABYLON.VertexData();
  vd.positions=pos;vd.normals=nor;vd.uvs=uvs;vd.indices=idx;
  vd.applyToMesh(mesh);
  return mesh;
}

const FLOOR_SCALE=.55;
const FLOOR_POSES=[
  [-6.2, 2.6,  .40],[-5.8,-0.6, -.30],[-3.2, 3.4, -.60],[-2.9, 0.4,  .20],
  [-0.4,-1.8,  .50],[ 0.2, 2.2, -.15],[ 2.6, 3.6,  .55],[ 2.9, 0.6, -.45],
  [ 5.4, 2.4,  .10],[ 5.8,-0.8, -.55],[-0.2, 5.2,  .30],[ 3.0, 5.8, -.20],
];
function poseOf(i){                  // 超過預設 12 格時以黃金角散布
  if(FLOOR_POSES[i])return FLOOR_POSES[i];
  const a=i*2.39996, r=2.4+(i%5)*.95;
  return [Math.max(-6.6,Math.min(6.6,Math.cos(a)*r)),
          Math.max(-1.8,Math.min(6.4,2.2+Math.sin(a)*r*.7)),
          ((i*73)%100)/100-.5];
}

/* page curl shader（解析法線） */
BABYLON.Effect.ShadersStore['flipVertexShader']=`
precision highp float;
attribute vec3 position; attribute vec2 uv;
uniform mat4 worldViewProjection; uniform mat4 world;
uniform float uProgress; uniform float uBend; uniform float uW;
varying vec2 vUv; varying vec3 vWorld; varying vec3 vNorm;
const float PI=3.14159265;
void main(){
  vUv=uv;
  float a=uProgress*PI;
  float th =a+uBend*sin(uv.x*PI)*sin(a);
  float thp=  uBend*(PI/uW)*cos(uv.x*PI)*sin(a);
  float x=position.x;
  vec3 p=vec3(x*cos(th), x*sin(th), position.z);
  vec3 n=vec3(-(sin(th)+x*cos(th)*thp), cos(th)-x*sin(th)*thp, 0.0);
  vWorld=(world*vec4(p,1.0)).xyz;
  vNorm =normalize((world*vec4(n,0.0)).xyz);
  gl_Position=worldViewProjection*vec4(p,1.0);
}`;
BABYLON.Effect.ShadersStore['flipFragmentShader']=`
precision highp float;
varying vec2 vUv; varying vec3 vWorld; varying vec3 vNorm;
uniform sampler2D uFront; uniform sampler2D uBack;
uniform vec3 uLightPos; uniform vec3 uLightColor; uniform float uLightInt;
void main(){
  vec3 n=normalize(vNorm);
  vec3 base;
  if(gl_FrontFacing){ base=texture2D(uFront,vUv).rgb; }
  else{ base=texture2D(uBack,vec2(1.0-vUv.x,vUv.y)).rgb; n=-n; }
  vec3 Ld=uLightPos-vWorld;
  float dist=length(Ld); Ld/=dist;
  float diff=max(dot(n,Ld),0.0);
  float att=max(0.0,1.0-dist/26.0);
  vec3 lit=base*(0.32+uLightColor*diff*uLightInt*1.5*att);
  lit*=mix(0.74,1.0,smoothstep(0.0,0.16,vUv.x));
  lit*=mix(1.0,0.92,smoothstep(0.75,1.0,vUv.x));
  gl_FragColor=vec4(lit,1.0);
}`;
const flipMat=new BABYLON.ShaderMaterial('flipM',scene,

  {attributes:['position','uv'],

   samplers:['uFront','uBack']});
flipMat.backFaceCulling=false;

function readTap(rightSide){

  if(rightSide){

    else{
      if(cur>=faces.length)return;
      const wasCover=(cur===0);
      startFlip(true);
      flipAnim.afterFocus=wasCover?'R':'L';
      readFocus='C';
    }
  }else{
    if(readFocus==='R'&&cur>0){ readFocus='L'; renderChips(); }
    else{
      if(cur<=0)return;
      startFlip(false);
      flipAnim.afterFocus='R';
      readFocus='C';
    }
  }
}

/* ---------------- 音效（合成） ---------------- */
let actx=null;
function ac(){return actx=actx||new (window.AudioContext||window.webkitAudioContext)();}
function rustle(vol){
  try{
    const a=ac(),dur=.55,sr=a.sampleRate;
    const buf=a.createBuffer(1,sr*dur,sr),d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,1.4);
    const src=a.createBufferSource();src.buffer=buf;
    const bp=a.createBiquadFilter();bp.type='bandpass';
    bp.frequency.setValueAtTime(900,a.currentTime);
    bp.frequency.exponentialRampToValueAtTime(2600,a.currentTime+dur*.7);
    bp.Q.value=.8;
    const g=a.createGain();
    g.gain.setValueAtTime(0,a.currentTime);
    g.gain.linearRampToValueAtTime(vol*.25,a.currentTime+.06);
    g.gain.exponentialRampToValueAtTime(.001,a.currentTime+dur);
    src.connect(bp).connect(g).connect(a.destination);src.start();
  }catch(e){}
}
function tearSound(){
  try{
    const a=ac(),dur=.3,sr=a.sampleRate;
    const buf=a.createBuffer(1,sr*dur,sr),d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,.7);
    const src=a.createBufferSource();src.buffer=buf;
    const bp=a.createBiquadFilter();bp.type='bandpass';
    bp.frequency.setValueAtTime(3200,a.currentTime);
    bp.frequency.exponentialRampToValueAtTime(1400,a.currentTime+dur);
    bp.Q.value=.7;
    const g=a.createGain();
    g.gain.setValueAtTime(.12,a.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,a.currentTime+dur);
    src.connect(bp).connect(g).connect(a.destination);src.start();
  }catch(e){}
}
function footstep(){
  try{
    const a=ac(),t=a.currentTime;
    const o=a.createOscillator();o.type='sine';
    o.frequency.setValueAtTime(82,t);
    o.frequency.exponentialRampToValueAtTime(46,t+.14);
    const g=a.createGain();
    g.gain.setValueAtTime(.0001,t);
    g.gain.linearRampToValueAtTime(.10,t+.012);
    g.gain.exponentialRampToValueAtTime(.0001,t+.2);
    o.connect(g).connect(a.destination);o.start(t);o.stop(t+.22);
  }catch(e){}
}

/* ---------------- 互動 ---------------- */
const mouse={x:0,y:0};
let hovered=null;
addEventListener('pointermove',e=>{
  mouse.x=(e.clientX/innerWidth)*2-1;
  mouse.y=(e.clientY/innerHeight)*2-1;
  if(state==='CHOOSE'&&FINE){
    const hit=scene.pick(scene.pointerX,scene.pointerY,pickPredicate);
    const idx=hit&&hit.hit?hit.pickedMesh.metadata.bookIndex:-1;
    if(hovered!==null&&hovered!==idx)floorBooks[hovered].root.position.y=0;
    hovered=idx>=0?idx:null;
    if(hovered!==null)floorBooks[hovered].root.position.y=0.09;
    stage.style.cursor=hovered!==null?'pointer':'default';
  }
});
addEventListener('pointerdown',e=>{
  if(vmodal.classList.contains('show'))return;
  if(e.target.closest&&e.target.closest('.chip,#down,#lang'))return;
  if(state==='INTRO'){startWalk();return;}
  if(state==='CHOOSE'){
    const hit=scene.pick(scene.pointerX,scene.pointerY,pickPredicate);
    if(hit&&hit.hit)startPickup(hit.pickedMesh.metadata.bookIndex);
    return;
  }
  if(state==='READ'){readTap(e.clientX>innerWidth/2);}
});
addEventListener('keydown',e=>{
  if(vmodal.classList.contains('show')){if(e.key==='Escape')closeVideo();return;}
  if(state==='INTRO'&&(e.key===' '||e.key==='Enter')){startWalk();return;}
  if(state!=='READ')return;
  if(e.key==='ArrowRight'||e.key===' ')readTap(true);
  if(e.key==='ArrowLeft')readTap(false);
  if(e.key==='Escape')startPutback();
});
downBtn.addEventListener('pointerdown',e=>{e.stopPropagation();startPutback();});
addEventListener('resize',()=>engine.resize());

/* ---------------- 主迴圈 ---------------- */
let t0=performance.now(), lastStepPhase=1, chipFrameKey='';
engine.runRenderLoop(()=>{
  const t=(performance.now()-t0)/1000;
  const fl=.75+Math.sin(t*7.3)*.05+Math.sin(t*13.7+1.3)*.035+Math.sin(t*2.1)*.025;
  candle.intensity=fl;
  flipMat.setFloat('uLightInt',fl);
  flipMat.setVector3('uLightPos',candle.position);

  if(state==='WALK'){
    walkT+=0.016/3.4;
    const e=easeInOut(Math.min(walkT,1));
    const bob=Math.sin(walkT*3.4*PI*2.2);
    tgtPos.set(Math.sin(walkT*3.4*PI*1.1)*.14, 7.6+(REDUCED?0:bob*.14*(1-e*.5)), 18-(18-8.6)*e);
    tgtLook.set(0, 4.2-(4.2-0.6)*e, 0.8);
    if(!REDUCED&&bob<-.85&&lastStepPhase>=-.85)footstep();
    lastStepPhase=bob;
    if(walkT>=1){
      if(EVENTS.length){
        state='CHOOSE';
        setHint(S('hintChoose',EVENTS.length));
      }else{
        state='WAITDATA';
        setHint(DATA_ERR?S('loadFail',DATA_ERR):S('loading'));
      }
    }
  }else if(state==='CHOOSE'||state==='WAITDATA'){
    chooseCamTargets();
    if(FINE){
      tgtPos.x+=mouse.x*.5; tgtPos.y+=-mouse.y*.3;
      tgtLook.x+=mouse.x*.4;
    }
  }else if(state==='READ'||state==='TEAR'){
    readCamTargets();
    if(state==='READ'&&!REDUCED&&FINE){
      tgtPos.x+=mouse.x*.12;
      tgtPos.y+=-mouse.y*.08+Math.sin(t*.55)*.03;
    }
  }

  if(pickupAnim){
    const A=pickupAnim;
    const k=Math.min((performance.now()-A.t0)/A.dur,1);
    const e=easeInOut(k);
    BABYLON.Vector3.LerpToRef(A.fromP,A.toP,e,A.node.position);
    A.node.position.y+=Math.sin(e*PI)*(A.reverse?0.5:0.9);
    BABYLON.Quaternion.SlerpToRef(A.fromQ,A.toQ,e,A.node.rotationQuaternion);
    A.node.scaling.setAll(A.fromS+(A.toS-A.fromS)*e);
    if(!A.reverse){
      readCamTargets();
      const cp=tgtPos.clone(), cl=tgtLook.clone();
      chooseCamTargets();
      BABYLON.Vector3.LerpToRef(tgtPos,cp,e,tgtPos);
      BABYLON.Vector3.LerpToRef(tgtLook,cl,e,tgtLook);
    }
    if(k>=1){
      if(!A.reverse){
        A.node.setEnabled(false);
        rig.position.copyFrom(RIG_POS);
        rig.rotation.set(RIG_TILT,0,0);
        rig.setEnabled(true);
        syncBook();
        startTear();           // 到手 → 撕便條
      }else{
        state='CHOOSE';
        setHint(S('hintChoose',EVENTS.length));
      }
      pickupAnim=null;
    }
  }

  /* 撕便條紙 */
  if(tearAnim){
    const now=performance.now();
    if(now>=tearAnim.t0){
      if(tear_sound_pending){tearSound();tear_sound_pending=false;}
      const k=Math.min((now-tearAnim.t0)/tearAnim.dur,1);
      const e=k*k;                                   // ease-in：先慢後快地飛走
      rigNote.position.set(PW*0.55+e*1.6, THICK+0.02+Math.sin(e*PI)*1.1+e*.4, 0.32+e*1.3);
      rigNote.rotation.set(-e*.9,.1+e*1.4,e*.6);
      rigNoteMat.alpha=1-Math.max(0,(k-.55)/.45);
      if(k>=1){
        rigNote.setEnabled(false);
        tearAnim=null;
        startFlip(true);                              // 自動翻開封面
      }
    }
  }

  if(flipAnim){
    const k=Math.min((performance.now()-flipAnim.t0)/flipAnim.dur,1);
    flipMat.setFloat('uProgress',flipAnim.from+(flipAnim.to-flipAnim.from)*easeInOut(k));
    if(k>=1){
      flipAnim.after();
      if(flipAnim.afterFocus)readFocus=flipAnim.afterFocus;
      else if(!isPortrait())readFocus='R';
      flipAnim=null;
      flipping=false;
      flipPage.setEnabled(false);
      flipMat.setFloat('uProgress',0);
      syncBook();
      if(state==='TEAR'){                              // 開封完成 → 進入閱讀
        state='READ';
        folio.classList.add('show');
        downBtn.classList.add('show');
        setHint(isPortrait()?S('hintReadPort'):S('hintRead'));
        setTimeout(()=>setHint(''),3800);
      }
      renderChips();
      if(pendingLang){const l=pendingLang;pendingLang=null;setLang(l);}
    }
  }

  if(state==='READ'&&readFocus==='C'){
    const d=fitDist();
    tgtPos.copyFrom(RIG_POS).addInPlace(READ_DIR.scale(d*1.06));
    tgtLook.set(RIG_POS.x,RIG_POS.y+0.25,RIG_POS.z-0.15);
  }

  /* chips 隨可見頁面變化 */
  const ck=state+'|'+cur+'|'+readFocus+'|'+flipping+'|'+LANG;
  if(ck!==chipFrameKey){chipFrameKey=ck;renderChips();}

  const k2=state==='WALK'?0.12:0.055;
  BABYLON.Vector3.LerpToRef(camPos,tgtPos,k2,camPos);
  BABYLON.Vector3.LerpToRef(camLook,tgtLook,k2,camLook);
  camera.position.copyFrom(camPos);
  camera.setTarget(camLook);
  scene.render();
});

/* ---------------- init ---------------- */
applyDom();
loadData();
</script>
