  # ──────────────────────────────────────────────
  - id: "lai-national-security"
    category: "justice"
    status: "closed"
    art: "scale"
    opened: "2020-12-03"
    last_progress: "2026-03-06"
    title:
      zh: "黎智英國安案"
      en: "Jimmy Lai national-security case"
    summary:
      zh: "壹傳媒創辦人黎智英國安案一審判囚 20 年，律師團隊宣布不上訴，這條司法路走到了盡頭。"
      en: "Media founder Jimmy Lai was sentenced to 20 years at first instance under the national-security law; his lawyers say there will be no appeal, and this legal road has reached its end."
    timeline:
      - date: "2020-12-03"
        art: "prison"
        text:
          zh: "黎智英首度因涉嫌違反《港區國安法》被拘捕。"
          en: "Lai is first arrested on suspicion of breaching Hong Kong's national-security law."
      - date: "2026-02-09"
        art: "gavel"
        text:
          zh: "「串謀勾結外國勢力」等罪成立，一審判處 20 年，為國安法實施以來最重刑期。"
          en: "Convicted of conspiracy to collude with foreign forces and other charges, he is sentenced to 20 years — the heaviest term since the law took effect."
        source:
          name: "BBC 中文"
          url: "https://www.bbc.com/zhongwen/articles/cr450w2v112o/trad"
      - date: "2026-02-26"
        art: "scale"
        text:
          zh: "另案欺詐罪上訴得直、定罪與刑罰撤銷，出獄時間略為提前。"
          en: "In a separate fraud case his appeal succeeds, the conviction and sentence quashed, bringing his release slightly forward."
        source:
          name: "德國之聲 DW"
          url: "https://www.dw.com/zh-hant/%E5%BE%8B%E5%B8%AB%E5%9C%98%E9%9A%8A%E9%BB%8E%E6%99%BA%E8%8B%B1%E4%B8%8D%E6%9C%83%E5%B0%8D%E5%9C%8B%E5%AE%89%E7%BD%AA%E5%88%A4%E6%B1%BA%E6%8F%90%E8%B5%B7%E4%B8%8A%E8%A8%B4/a-76246023"
    outcome:
      date: "2026-03-06"
      text:
        zh: "國安案一審判囚 20 年、不再上訴，黎智英須服刑至 2040 年。"
        en: "Twenty years at first instance, no further appeal — Lai is to remain imprisoned until 2040."
