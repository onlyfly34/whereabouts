          name: "US CDC"
          url: "https://www.cdc.gov/bird-flu/situation-summary/index.html"
      - date: "2026-04-01"
        art: "virus"
        text:
          zh: "WHO 通報第一季四大洲出現新的人類禽流感與豬流感病例。"
          en: "The WHO reports new human avian- and swine-flu cases across four continents in the first quarter."
        source:
          name: "WHO"
          url: "https://www.who.int/news-room/fact-sheets/detail/influenza-(avian-and-other-zoonotic)"
    stuck:
      zh: "病毒在禽鳥、乳牛與其他哺乳類間不斷流行，每一次跨物種感染都是一次賭注；只要它學會在人與人之間傳播，局面就會改變——而沒有人知道那一天會不會來。"
      en: "The virus circulates in birds, dairy cattle and other mammals, and every cross-species jump is a roll of the dice. The day it learns to pass between people, everything changes — and no one knows whether that day will come."

