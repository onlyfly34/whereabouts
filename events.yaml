      zh: "誰來管理戰後加薩、哈瑪斯是否繳械、國際穩定部隊由誰組成——這些第二階段的關鍵問題沒有共識，協議隨時可能停擺。"
      en: "Who governs post-war Gaza, whether Hamas disarms, who makes up the international force — phase two's core questions have no agreement, and the deal could stall at any moment."

