#   timeline[].video:  選填，YouTube 影片 id（網址 v= 後面那串）
#   outcome:       僅結案事件需要（date + text）
#
# ── 文字原則 ──
#   每個節點一句話，精簡克制、不狗血。
#   每件事至少 2 個獨立可信來源（官方報告 / 通訊社 / 具公信力媒體）。
#
# ============================================================

