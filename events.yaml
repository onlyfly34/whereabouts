  # ──────────────────────────────────────────────
  - id: "mh370"
    category: "missing"
    status: "open"
    art: "ship"
    opened: "2014-03-08"
    last_progress: "2026-03-08"
    title:
      zh: "馬航 MH370 海底搜索"
      en: "MH370 deep-sea search"
    summary:
      zh: "失聯滿十二年，最新一輪深海搜索又一次空手而歸，239 人下落仍是空白。"
      en: "Twelve years missing, and the latest deep-sea search has come back empty again. The fate of all 239 aboard is still a blank."
    timeline:
      - date: "2014-03-08"
        art: "plane"
        text:
          zh: "班機從吉隆坡飛往北京途中失聯，機上 239 人至今未尋獲。"
          en: "The flight from Kuala Lumpur to Beijing vanished; none of the 239 aboard have been found."
      - date: "2025-12"
        art: "ship"
        text:
          zh: "Ocean Infinity 依「找不到、不收費」合約重啟印度洋南部搜索。"
          en: "Ocean Infinity resumes the search in the southern Indian Ocean on a \"no find, no fee\" deal."
        source:
          name: "NPR"
          url: "https://www.npr.org/2026/03/09/g-s1-112960/12-years-missing-flight-mh370"
      - date: "2026-01-23"
        art: "ocean"
        text:
          zh: "搜索船因天候與進度問題駛離搜索區。"
          en: "The search vessel leaves the zone, citing weather and slow progress."
      - date: "2026-03-08"
        art: "ocean"
        text:
          zh: "公司宣布本輪搜索結束，掃描約 7,571 平方公里仍無發現。"
          en: "The company declares this round over: about 7,571 sq km scanned, still nothing."
        source:
          name: "Ocean Infinity"
          url: "https://oceaninfinity.com/news/conclusion-of-the-search-for-malaysian-airlines-flight-mh370/"
    stuck:
      zh: "新合約原訂效期到 2026 年中，但搜索船掃完規劃海域仍一無所獲，已提前撤離；下一步要往哪裡找，沒有答案。"
      en: "The new contract ran to mid-2026, but the ship swept its planned zone, found nothing, and left early. Where to look next has no answer."

