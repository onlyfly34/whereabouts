          en: "The concrete canopy at the renovated Novi Sad station suddenly collapses, killing 16."
      - date: "2026-02-19"
        art: "crowd"
        text:
          zh: "學生主導的反政府抗議持續第十五個月，訴求問責與公正調查。"
