  # 濟州航空 2216 班機空難調查
  # ──────────────────────────────────────────────
  - id: "jeju-air-2216"
    category: "disaster"
    status: "open"
    art: "plane"
    opened: "2024-12-29"
    last_progress: "2026-06-10"
    title:
      zh: "濟州航空 2216 班機空難調查"
      en: "Jeju Air Flight 2216 crash inquiry"
    summary:
      zh: "事發超過一年，179 人罹難的最終調查報告仍未定案，責任歸屬還在拉扯。"
      en: "More than a year on, the final report into the crash that killed 179 is still unsettled, and the question of blame is still being fought over."
    timeline:
      - date: "2024-12-29"
        art: "plane"
        text:
          zh: "班機在務安機場落地時起落架未放下，衝出跑道撞上混凝土定位牆，179 人罹難。"
          en: "Landing at Muan with its gear up, the jet overran the runway and struck a concrete localizer wall; 179 people died."
        source:
          name: "BBC"
          url: "https://www.bbc.com/news/articles/cz0gzd0dx1do"
      - date: "2025-01-11"
        art: "blackbox"
        text:
          zh: "調查單位證實兩具黑盒子在撞擊前約四分鐘同時停止記錄。"
          en: "Investigators confirm both black boxes stopped recording about four minutes before impact."
        source:
          name: "YouTube · 濟州空難調查無恥度"
          url: "https://www.youtube.com/watch?v=tjHq-VcVx80"
        video: "tjHq-VcVx80"
      - date: "2026-01-10"
        art: "report"
        text:
          zh: "報告指出，若沒有那道牆，這場事故原本是可生還的；隨即引爆「把報告壓下來」的爭議。"
          en: "A report finds the crash would have been survivable without that wall — and instantly sets off a row over a cover-up."
        source:
          name: "SCMP"
          url: "https://www.scmp.com/week-asia/health-environment/article/3339677/south-koreas-worst-air-disaster-fury-erupts-over-mound-death"
      - date: "2026-06-10"
        art: "search"
        text:
          zh: "警方搜索國土交通部總部，調查機場設施與監理責任。"
          en: "Police raid the transport ministry's headquarters, probing the airport's design and oversight."
        source:
          name: "Chosun Biz"
          url: "https://biz.chosun.com/en/en-society/2026/06/10/DVU2YLGZJBF7DKV4OPF26CAX2A/"
    stuck:
      zh: "報告把焦點放在鳥擊與機組處置，卻迴避了那道致命的混凝土定位牆設計；家屬與在野黨指控官方想把問題壓下去。"
      en: "The report dwells on the bird strike and the crew's handling, yet sidesteps the deadly concrete localizer wall. Families and the opposition accuse officials of trying to bury it."

