#   status:        open（未結案）| closed（已結案）
#   art:           封面浮水印圖樣，見 README 的插圖清單
#   opened:        立案日（事件起點，YYYY-MM-DD）
#   last_progress: 最後一次進展日
#   title/summary/text/stuck: 都要有 zh（繁中）與 en（英文）兩個版本
